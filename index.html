<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Think before you react: what should I do next?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-outcome="none">
  <main>
    <header>
      <h1>Think before you react</h1>
      <p class="lede">Something just got under your skin. Tell me what happened and how you feel, and I'll suggest your next move.</p>
    </header>

    <form id="form" novalidate>
      <label for="situation" class="q">What happened?</label>
      <textarea id="situation" rows="4" placeholder="Example: My coworker texted that my report was sloppy and I should have known better."></textarea>

      <fieldset>
        <legend class="q">How do you feel right now?</legend>
        <div class="chips">
          <label><input type="radio" name="feeling" value="angry"><span>Angry</span></label>
          <label><input type="radio" name="feeling" value="hurt"><span>Hurt</span></label>
          <label><input type="radio" name="feeling" value="anxious"><span>Anxious</span></label>
          <label><input type="radio" name="feeling" value="annoyed"><span>Annoyed</span></label>
          <label><input type="radio" name="feeling" value="confused"><span>Confused</span></label>
        </div>
      </fieldset>

      <label for="intensity" class="q">How strong is it? <output id="intensity-out">5</output> of 10</label>
      <input type="range" id="intensity" min="1" max="10" value="5">
      <div class="scale"><span>Barely</span><span>Overwhelming</span></div>

      <p id="error" role="alert"></p>
      <button type="submit" class="primary">Tell me what to do</button>
    </form>

    <section id="result" aria-live="polite" hidden></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
